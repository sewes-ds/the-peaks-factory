# Source-only fragment. Do not include or activate without the production gate.

location = /admin {
    return 308 /admin/;
}

location ^~ /admin-api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}

location ^~ /admin/assets/ {
    alias /srv/the-peaks-factory/current/frontend/admin/assets/;
    access_log off;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /admin/ {
    alias /srv/the-peaks-factory/current/frontend/admin/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
